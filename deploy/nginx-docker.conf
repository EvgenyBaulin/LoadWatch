# Nginx хоста для Docker-варианта (docker-compose.prod.yml): только TLS и прокси
# на контейнер frontend (127.0.0.1:8080). Статика, CSP и /api/ — внутри контейнера.
# Для основного пути без Docker используйте deploy/nginx.conf, а не этот файл.
#
#   /etc/nginx/sites-available/loadwatch.conf ← этот файл (вместо nginx.conf)

map $request_method $loadwatch_auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $loadwatch_auth_limit_key zone=loadwatch_auth:1m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name loadwatch.tarakan-tuc.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Директива http2 — с nginx 1.25.1; для nginx 1.24 (Ubuntu 24.04) замените на
    # listen 443 ssl http2; и уберите строку http2 on;.
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name loadwatch.tarakan-tuc.ru;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/loadwatch.tarakan-tuc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loadwatch.tarakan-tuc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:loadwatch_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;

    # Остальные заголовки ставит Nginx контейнера; HSTS — только здесь, где есть TLS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/v1/auth/ {
        limit_req zone=loadwatch_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # Nginx контейнера берёт реальный IP из этого заголовка (set_real_ip_from).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }
}
