# Лимит журнала systemd на диске 15 ГБ: логи API (journalctl -u loadwatch-api)
# и задач при запуске через таймеры не съедят место.
# Установка: /etc/systemd/journald.conf.d/loadwatch.conf, затем
#   systemctl restart systemd-journald
[Journal]
SystemMaxUse=200M
SystemKeepFree=1G
MaxRetentionSec=1month
Compress=yes
