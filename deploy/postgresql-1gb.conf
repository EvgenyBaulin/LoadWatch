# Настройки PostgreSQL 16 для VPS 1 vCPU / 1 ГБ RAM, где рядом работают API
# (~250 МБ) и runner (~400 МБ). Postgres остаётся около 200-250 МБ.
# Установка (bootstrap-server.sh): /etc/postgresql/16/main/conf.d/loadwatch.conf,
# затем systemctl restart postgresql. Проверка: SHOW shared_buffers;
#
# На тарифе 2 ГБ можно удвоить shared_buffers и effective_cache_size.

# --- соединения ---
# API: пул DB_POOL_SIZE (5) на воркер + runner/digest/maintenance + psql админа.
max_connections = 20
listen_addresses = 'localhost'

# --- память ---
shared_buffers = 128MB
# На операцию сортировки/хэша; при 20 соединениях худший случай остаётся разумным.
work_mem = 4MB
maintenance_work_mem = 64MB
# Подсказка планировщику: сколько данных ОС держит в page cache.
effective_cache_size = 384MB
huge_pages = off

# --- WAL и контрольные точки: умеренно, чтобы не писать на диск лишнего ---
wal_level = replica
wal_buffers = 4MB
min_wal_size = 80MB
max_wal_size = 512MB
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
wal_compression = on

# --- один CPU: параллельные планы только мешают ---
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0

# --- диск (SSD у VPS) ---
random_page_cost = 1.1
effective_io_concurrency = 100

# --- autovacuum: посекундные ряды часто удаляются maintenance ---
autovacuum_max_workers = 2
autovacuum_naptime = 1min

# --- логи ---
log_min_duration_statement = 1000
log_timezone = 'UTC'
timezone = 'UTC'
