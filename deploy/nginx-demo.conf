# Nginx для демо-сайта (demo_target) — отдельный поддомен на том же сервере.
#
# Демо-цель слушает 127.0.0.1:8081, а снаружи доступна по HTTPS на публичном адресе.
# Поэтому LoadWatch тестирует её как обычный внешний сайт: ALLOW_PRIVATE_TARGETS
# остаётся false, защита от SSRF не ослабляется.
#
# Ставит bootstrap-server.sh (DEMO_DOMAIN), домен подставляется вместо demo.loadwatch.tarakan-tuc.ru.
# Лимитов запросов здесь нет: на этот сайт и подаётся нагрузка. Ёмкость /limited
# задаётся в самом demo_target (DEMO_CAPACITY_RPS в /etc/loadwatch/demo.env).

upstream loadwatch_demo {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name demo.loadwatch.tarakan-tuc.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.loadwatch.tarakan-tuc.ru;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/demo.loadwatch.tarakan-tuc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/demo.loadwatch.tarakan-tuc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:loadwatch_demo_ssl:2m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 64k;
    # Под нагрузкой журнал запросов только съедал бы диск и CPU.
    access_log off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://loadwatch_demo;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
