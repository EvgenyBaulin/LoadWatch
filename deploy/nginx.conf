# Nginx для LoadWatch на VPS (основной путь: systemd + cron + Nginx).
#
# Установка (делает bootstrap-server.sh):
#   /etc/nginx/sites-available/loadwatch.conf  ← этот файл
#   ln -s ../sites-available/loadwatch.conf /etc/nginx/sites-enabled/
#   /etc/nginx/snippets/loadwatch-headers.conf ← генерирует deploy.sh из
#       frontend/dist/index.html (CSP с хэшем inline-скрипта темы, HSTS и пр.)
#
# Сертификат Let's Encrypt выпускается certbot в режиме webroot (каталог
# /var/www/certbot), поэтому certbot этот файл не правит. Продление — таймер
# certbot.timer из пакета, после продления Nginx перечитывает сертификат
# (deploy-hook, его ставит bootstrap-server.sh).
#
# Файл подключается внутри блока http {} (sites-enabled), поэтому зоны лимитов
# и map объявлены прямо здесь.

# Лимит на вход и регистрацию: считаются только POST (пустой ключ Nginx не учитывает),
# чтобы частые GET /api/v1/auth/me при открытии страниц не упирались в лимит.
# API держит свой лимит (AUTH_RATE_LIMIT_PER_MINUTE); этот — грубый фильтр до Python.
map $request_method $loadwatch_auth_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $loadwatch_auth_limit_key zone=loadwatch_auth:1m rate=20r/m;

upstream loadwatch_api {
    server 127.0.0.1:8000;
    keepalive 8;
}

# --- HTTP: только ACME-проверка и редирект на HTTPS ---------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name loadwatch.tarakan-tuc.ru;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---------------------------------------------------------------------------
server {
    # Синтаксис http2 в listen — для nginx 1.24 из Ubuntu 24.04 (директива http2 on появилась в 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name loadwatch.tarakan-tuc.ru;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/loadwatch.tarakan-tuc.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loadwatch.tarakan-tuc.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:loadwatch_ssl:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Тела запросов API маленькие (сценарии, настройки); больше 1 МБ — 413.
    client_max_body_size 1m;

    root /opt/loadwatch/frontend/dist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json text/csv;

    # Заголовки безопасности (CSP, HSTS, nosniff, frame-ancestors …).
    # add_header внутри location отменяет унаследованные, поэтому include повторяется.
    include /etc/nginx/snippets/loadwatch-headers.conf;

    # Продление сертификата идёт по HTTP, но пусть путь работает и здесь.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # --- API ---
    location /api/ {
        proxy_pass http://loadwatch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Ровно реальный адрес клиента: присланный клиентом X-Forwarded-For отбрасывается,
        # иначе лимиты API по IP обходились бы подделкой заголовка.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        proxy_buffering off;
    }

    location /api/v1/auth/ {
        limit_req zone=loadwatch_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://loadwatch_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Статика фронтенда (собрана в CI, на VPS Node не ставится) ---
    # Ассеты Vite с хэшем в имени — кэш на год.
    location /assets/ {
        include /etc/nginx/snippets/loadwatch-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # index.html всегда перепроверяется, чтобы после деплоя подтянулись новые ассеты.
    location = /index.html {
        include /etc/nginx/snippets/loadwatch-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # SPA: неизвестные пути (/sites/…) отдают index.html, маршрутизирует Vue.
    location / {
        include /etc/nginx/snippets/loadwatch-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri $uri/ /index.html;
    }
}
