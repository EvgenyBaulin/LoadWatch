<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LoadWatch</title>
    <script>
      // Тема и язык применяются до монтирования Vue, чтобы не было вспышки светлой темы.
      ;(function () {
        var root = document.documentElement
        var mode = 'system'
        var locale = null
        try {
          mode = localStorage.getItem('lw.theme') || 'system'
          locale = localStorage.getItem('lw.locale')
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        root.setAttribute('data-theme', dark ? 'dark' : 'light')
        if (locale !== 'ru' && locale !== 'en') {
          locale = (navigator.language || 'en').toLowerCase().indexOf('ru') === 0 ? 'ru' : 'en'
        }
        root.setAttribute('lang', locale)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
