[project]
name = "loadwatch"
version = "0.1.0"
description = "Website performance monitoring through scheduled load tests"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "croniter>=3.0",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "dnspython>=2.6",
    "cryptography>=43",
    "jinja2>=3.1",
    "reportlab>=4.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-croniter",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loadwatch"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "S", "SIM", "RUF", "D"]
# RUF001-003: комментарии и docstring'и пишутся по-русски, кириллица — не опечатка.
ignore = ["D105", "D107", "D203", "D213", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "D"]
"demo_target/**" = ["S311"]
"scripts/**" = ["T20"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["frontend/"]

[[tool.mypy.overrides]]
module = ["reportlab.*", "dns.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = [
    # TestClient из Starlette предлагает httpx2; LoadWatch намеренно использует httpx.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["loadwatch"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
