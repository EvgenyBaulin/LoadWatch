# Local PostgreSQL for development and tests.
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loadwatch
      POSTGRES_PASSWORD: loadwatch
      POSTGRES_DB: loadwatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/dev-init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loadwatch"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m

volumes:
  pgdata:
