default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
# Vendored files (fonts and their license) are kept byte-for-byte as upstream.
exclude: ^loadwatch/assets/fonts/

repos:
  # Commits must be authored by the project owner; no co-author trailers.
  - repo: local
    hooks:
      - id: check-author
        name: author is the owner
        entry: scripts/check-author.sh ident
        language: system
        always_run: true
        pass_filenames: false
      - id: check-commit-trailers
        name: no co-author trailers in message
        entry: scripts/check-author.sh msg
        language: system
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  # ruff and mypy run from the uv environment so versions match uv.lock and CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy loadwatch
        language: system
        types: [python]
        pass_filenames: false
